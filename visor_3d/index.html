<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor 3D Interactivo</title>
  <style>
    body { margin: 0; background: transparent; color: inherit; font-family: sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    #info { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 6px; border: 1px solid #444; text-align: right; pointer-events: none; color: #fff;}
    
    #ui-container { 
      position: absolute; top: 10px; left: 10px; z-index: 10; 
      background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 6px; 
      border: 1px solid #475569; width: 240px; max-height: 92vh; overflow-y: auto; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #f8fafc;
    }
    #ui-container::-webkit-scrollbar { width: 4px; }
    #ui-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
    
    .panel-title { font-size: 12px; font-weight: bold; margin-top: 0; margin-bottom: 8px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 3px; }
    .input-group { margin-bottom: 6px; }
    .input-group label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
    .input-group input[type="text"], .input-group select { width: 100%; box-sizing: border-box; padding: 4px; font-size: 11px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 3px; outline: none; }
    .input-group input[type="range"] { width: 100%; cursor: pointer; margin: 2px 0; }
    
    .plug-edit-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; background: rgba(0,0,0,0.2); padding: 3px; border-radius: 3px;}
    .plug-edit-row input[type="text"] { flex: 1; margin: 0; padding: 2px; font-size: 10px; }
    
    #btn-add-nz { width: 100%; padding: 6px; background: #38bdf8; color: #0f172a; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.2s; }
    #btn-add-nz:hover { background: #0284c7; color: #fff; }

    #btn-delete-nz { width: 100%; padding: 6px; background: #ef4444; color: #fff; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; transition: 0.2s; }
    #btn-delete-nz:hover { background: #b91c1c; }
    
    #editor-panel { display: none; background: rgba(56, 189, 248, 0.08); border: 1px solid #38bdf8; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    #editor-title { color: #38bdf8; font-weight: bold; margin-bottom: 6px; font-size: 11px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <h4 style="margin:0;">Visor 3D</h4>
    <p style="margin:0; font-size:10px; color:#38bdf8;">Scroll Click: Desplazar | Clic Izq: Rotar</p>
  </div>

  <div id="ui-container">
    <div class="panel-title">DATOS EQUIPO</div>
<div class="input-group"><label>TAG / Nameplate:</label><input id="nameplate-input" type="text"></div>
<button id="save-equipment" disabled style="width:100%;padding:10px;background:#22c55e;border:0;border-radius:4px;cursor:pointer">GUARDAR EQUIPO EN SHEETS</button>
<p id="save-status" role="status" style="font-size:11px;white-space:pre-wrap"></p>
    
    <div style="background: rgba(255,255,255,0.03); padding: 6px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 8px;">
      <strong style="display:block; font-size:10px; color:#38bdf8; margin-bottom:4px;">Plugs Bonete</strong>
      <div class="input-group">
        <label>Venteo:</label>
        <input type="text" id="vent-input" value="" placeholder='3/4"'>
      </div>
      <div class="input-group" style="margin-bottom:0;">
        <label>Drenaje:</label>
        <input type="text" id="drain-input" value="" placeholder='3/4"'>
      </div>
    </div>

    <!-- EDITOR BOQUILLA -->
    <div id="editor-panel">
      <div id="editor-title">✏️ Editando Boquilla</div>
      <div class="input-group">
        <label>Tag Boquilla:</label>
        <input type="text" id="edit-nz-name" value="" placeholder="Ej: N1">
      </div>

      <div style="display:flex; gap:4px;">
        <div class="input-group" style="flex:1;">
          <label>Diámetro:</label>
          <select id="edit-nz-dia">
            <option value='1/2"'>1/2"</option><option value='3/4"'>3/4"</option><option value='1"'>1"</option>
            <option value='1.5"'>1 1/2"</option><option value='2"'>2"</option><option value='3"'>3"</option>
            <option value='4"'>4"</option><option value='6"'>6"</option><option value='8"'>8"</option>
            <option value='10"'>10"</option><option value='12"'>12"</option>
          </select>
        </div>
        <div class="input-group" style="flex:1;">
          <label>Rating:</label>
          <select id="edit-nz-rating">
            <option value="150#">150#</option><option value="300#">300#</option><option value="600#">600#</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label>Cuerpo:</label>
        <select id="edit-nz-body">
          <option value="shell">Shell</option>
          <option value="channel">Channel</option>
          <option value="bonnet">Bonnet</option>
        </select>
      </div>
      
      <div class="input-group">
        <label>Posición:</label>
        <select id="edit-nz-pos">
          <option value="superior">Arriba</option>
          <option value="inferior">Abajo</option>
        </select>
      </div>
      
      <div class="input-group">
        <label>Posición X:</label>
        <input type="range" id="edit-nz-x" step="0.05">
      </div>
      
      <div class="plug-edit-row">
        <input type="checkbox" id="edit-ns-check">
        <label for="edit-ns-check" style="color:#fff; font-size:10px; margin:0;">NS:</label>
        <input type="text" id="edit-ns-name" placeholder="Medida NS" disabled>
      </div>
      <div class="plug-edit-row">
        <input type="checkbox" id="edit-fs-check">
        <label for="edit-fs-check" style="color:#fff; font-size:10px; margin:0;">FS:</label>
        <input type="text" id="edit-fs-name" placeholder="Medida FS" disabled>
