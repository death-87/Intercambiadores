<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor 3D Interactivo</title>
  <style>
    body { margin: 0; background: transparent; color: inherit; font-family: sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    #info { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 6px; border: 1px solid #444; text-align: right; pointer-events: none; color: #fff;}
    
    #ui-container { 
      position: absolute; top: 52px; left: 10px; z-index: 10; 
      background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 6px; 
      border: 1px solid #475569; width: 240px; max-height: calc(100vh - 84px); overflow-y: auto; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #f8fafc;
    }
    #ui-container::-webkit-scrollbar { width: 4px; }
    #ui-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
    #toggle-equipment-panel {
      position: absolute; top: 10px; left: 10px; z-index: 20;
      padding: 9px 12px; border: 1px solid #475569; border-radius: 6px;
      background: #0f172a; color: #f8fafc; font-size: 12px;
      font-weight: bold; cursor: pointer;
    }
    #toggle-equipment-panel:hover { background: #1e293b; border-color: #38bdf8; }
    #toggle-equipment-panel:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
    
    .panel-title { font-size: 12px; font-weight: bold; margin-top: 0; margin-bottom: 8px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 3px; }
    .input-group { margin-bottom: 6px; }
    .input-group label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
    .input-group input[type="text"], .input-group select { width: 100%; box-sizing: border-box; padding: 4px; font-size: 11px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 3px; outline: none; }
    .input-group input[type="range"] { width: 100%; cursor: pointer; margin: 2px 0; }
    
    .plug-edit-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; background: rgba(0,0,0,0.2); padding: 3px; border-radius: 3px;}
    .plug-edit-row input[type="text"] { flex: 1; margin: 0; padding: 2px; font-size: 10px; }
    
    #btn-add-nz { width: 100%; padding: 6px; background: #38bdf8; color: #0f172a; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.2s; }
    #btn-add-nz:hover { background: #0284c7; color: #fff; }

    #btn-delete-nz { width: 100%; padding: 6px; background: #ef4444; color: #fff; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; transition: 0.2s; }
    #btn-delete-nz:hover { background: #b91c1c; }
    
    #editor-panel { display: none; background: rgba(56, 189, 248, 0.08); border: 1px solid #38bdf8; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    #editor-title { color: #38bdf8; font-weight: bold; margin-bottom: 6px; font-size: 11px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <h4 style="margin:0;">Visor 3D</h4>
    <p style="margin:0; font-size:10px; color:#38bdf8;">Scroll Click: Desplazar | Clic Izq: Rotar</p>
  </div>

  <button id="toggle-equipment-panel" type="button" aria-controls="ui-container" aria-expanded="true" hidden>Ocultar datos equipo</button>
  <div id="ui-container">
    <div class="panel-title">DATOS EQUIPO</div>
<div class="input-group"><label>TAG / Nameplate:</label><input id="nameplate-input" type="text"></div>
<div class="input-group"><label for="equipment-model">Modelo del intercambiador:</label><select id="equipment-model"><option value="A">Modelo A · Bonete elíptico</option><option value="B">Modelo B · Cuerpo con transición cónica</option></select></div>
<button id="save-equipment" disabled style="width:100%;padding:10px;background:#22c55e;border:0;border-radius:4px;cursor:pointer">GUARDAR EQUIPO EN SHEETS</button>
<p id="save-status" role="status" style="font-size:11px;white-space:pre-wrap"></p>
    
    <div style="background: rgba(255,255,255,0.03); padding: 6px; border-radius: 4px; border: 1px solid #334155; margin-bottom: 8px;">
      <strong style="display:block; font-size:10px; color:#38bdf8; margin-bottom:4px;">Plugs Bonete</strong>
      <div class="input-group">
        <label>Venteo:</label>
        <input type="text" id="vent-input" value="" placeholder='3/4"'>
      </div>
      <div class="input-group" style="margin-bottom:0;">
        <label>Drenaje:</label>
        <input type="text" id="drain-input" value="" placeholder='3/4"'>

    </div>

    <!-- EDITOR BOQUILLA -->
    <div id="editor-panel">
      <div id="editor-title">✏️ Editando Boquilla</div>
      <div class="input-group">
        <label>Tag Boquilla:</label>
        <input type="text" id="edit-nz-name" value="" placeholder="Ej: N1">
      </div>

      <div style="display:flex; gap:4px;">
        <div class="input-group" style="flex:1;">
          <label>Diámetro:</label>
          <select id="edit-nz-dia">
            <option value='1/2"'>1/2"</option><option value='3/4"'>3/4"</option><option value='1"'>1"</option>
            <option value='1.5"'>1 1/2"</option><option value='2"'>2"</option><option value='3"'>3"</option>
            <option value='4"'>4"</option><option value='6"'>6"</option><option value='8"'>8"</option>
            <option value='10"'>10"</option><option value='12"'>12"</option>
          </select>

        <div class="input-group" style="flex:1;">
          <label>Rating:</label>

            <option value="150#">150#</option><option value="300#">300#</option><option value="600#">600#</option>

      </div>

      <div class="input-group">
        <label>Cuerpo:</label>

          <option value="shell">Shell</option>
          <option value="channel">Channel</option>

      </div>
      
      <div class="input-group">

        <select id="edit-nz-pos">
          <option value="superior">Arriba</option>

      <div class="input-group">

      <div class="plug-edit-row">
        <input type="checkbox" id="edit-ns-check">
        <label for="edit-ns-check" style="color:#fff; font-size:10px; margin:0;">NS:</label>
        <input type="text" id="edit-ns-name" placeholder="Medida NS" disabled>
      </div>
      <div class="plug-edit-row">
        <input type="checkbox" id="edit-fs-check">
        <label for="edit-fs-check" style="color:#fff; font-size:10px; margin:0;">FS:</label>
        <input type="text" id="edit-fs-name" placeholder="Medida FS" disabled>
      </div>

      <!-- BOTÓN ELIMINAR -->
      <button id="btn-delete-nz">🗑️ ELIMINAR BOQUILLA</button>
    </div>

    <div class="panel-title" style="margin-top: 8px;">➕ Nueva Boquilla</div>
    <div style="display:flex; gap:4px;">
      <div class="input-group" style="flex:1;">
        <select id="new-nz-dia">
          <option value='2"'>2"</option><option value='4"' selected>4"</option><option value='6"'>6"</option>
        </select>
      </div>
      <div class="input-group" style="flex:1;">
        <select id="new-nz-rating">
          <option value="150#">150#</option><option value="300#">300#</option>
        </select>
      </div>
    </div>
    
    <div class="input-group">
      <select id="new-nz-body">
        <option value="shell" selected>Shell</option>
        <option value="channel">Channel</option>
        <option value="bonnet">Bonnet</option>
      </select>
    </div>

    <button id="btn-add-nz">AGREGAR BOQUILLA</button>
  </div>

  <div id="canvas-container"></div>
  <div id="load-error" role="alert" style="display:none;position:absolute;bottom:12px;right:12px;max-width:440px;padding:12px;background:#7f1d1d;color:white;border-radius:6px;z-index:30;white-space:pre-wrap;font-size:12px"></div>

  <script>
    // La conexión con Streamlit no depende de Three.js ni de WebGL.
    (() => {
      const status = document.getElementById('save-status');
      const panel = document.getElementById('ui-container');
      const panelToggle = document.getElementById('toggle-equipment-panel');
      let panelCollapsed = false;
      let panelReadOnly = false;
      function updatePanel() {
        panel.style.display = panelReadOnly || panelCollapsed ? 'none' : '';
        panelToggle.hidden = panelReadOnly;
        panelToggle.setAttribute('aria-expanded', String(!panelReadOnly && !panelCollapsed));
        panelToggle.textContent = panelCollapsed ? 'Mostrar datos equipo' : 'Ocultar datos equipo';
      }
      panelToggle.addEventListener('click', () => {
        panelCollapsed = !panelCollapsed;
        updatePanel();
      });
      status.textContent = 'Conectando visor 3D...';
      const bridge = window.exchangerBridge = {
        args: null,
        render: null,
        setReadOnly(value) {
          panelReadOnly = Boolean(value);
          updatePanel();
        },
        send(type, fields) {
          window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, '*');
        },
        fail(error) {
          clearTimeout(bridge.timer);
          status.textContent = 'No se pudo iniciar el visor 3D: ' +
            (error && error.message ? error.message : String(error)) +
            '\nRecarga la página. Si persiste, copia este mensaje.';
          const errorBox = document.getElementById('load-error');
          errorBox.textContent = status.textContent;
          errorBox.style.display = 'block';
          console.error('Visor 3D:', error);
        },
        attach(render) {
          bridge.render = render;
          if (bridge.args) render(bridge.args);
        }
      };
      window.addEventListener('message', event => {
        if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
        bridge.args = event.data.args;
        bridge.setReadOnly(bridge.args.readonly);
        if (bridge.render) {
          try { bridge.render(bridge.args); } catch (error) { bridge.fail(error); }
        }
      });
      window.addEventListener('error', event => bridge.fail(event.error || event.message));
      window.addEventListener('unhandledrejection', event => bridge.fail(event.reason));
      bridge.timer = setTimeout(() => {
        status.textContent = 'La carga está tardando. Comprueba el acceso a cdn.jsdelivr.net y que WebGL esté disponible en el navegador.';
      }, 20000);
      bridge.send('streamlit:componentReady', {apiVersion: 1});
      bridge.send('streamlit:setFrameHeight', {height: 720});
    })();
  </script>

  <script type="module">
    try {
    const THREE = await import('three');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

    let initialized = false, loading = false, saving = false, readOnly = false;
    let revision = 0, pendingSave = null;
    const sessionId = globalThis.crypto?.randomUUID?.() ||
      Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    function send(type, fields) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, '*');
    }
    let currentNameplate = "";
    let currentModel = 'A';

    function syncStateToParent(action = "change") {
      if (loading || !initialized || readOnly) return;
      const exportData = {
        model: currentModel,
        nameplate: currentNameplate,
        vent: document.getElementById('vent-input').value || "",
        drain: document.getElementById('drain-input').value || "",
        nozzles: nozzlesList.map(nz => ({
          tagName: nz.userData.tagName || "",
          diaIndex: nz.userData.diaIndex !== undefined ? nz.userData.diaIndex : 4,
          rating: nz.userData.rating || "150#",
          bodyPart: nz.userData.bodyPart || "shell",
          pos: nz.userData.pos || "superior",
          valX: nz.userData.valX !== undefined ? nz.userData.valX : 0,
          hasNS: !!nz.userData.hasNS,
          tagNS: nz.userData.tagNS || "",
          hasFS: !!nz.userData.hasFS,
          tagFS: nz.userData.tagFS || ""
        }))
      };
      const eventId = sessionId + ':' + (++revision);
      if (action === 'save') pendingSave = eventId;
      send('streamlit:setComponentValue', {dataType: 'json', value: {
        event_id: eventId, action, data: exportData
      }});
    }

    let nozzlesList = [];
    let customNozzleCount = 0;

    const R = 0.549; 
    const L_SHELL = 4.275;
    const T_FLANGE = 0.12;
    const R_FLANGE = 0.65;
    
    const FLANGE_SHELL_R_X = 2.1975;
    const FLANGE_SHELL_L_X = -2.1975;
    const GASKET_T = 0.012; // Separación visual para distinguir la junta comprimida.
    const BONNET_GRP_X = 2.2575 + GASKET_T;
    const CHANNEL_GRP_X = -2.2575 - GASKET_T;
    const NOZZLE_Y = R - 0.01; 

    const BODY_BOUNDS = {
      shell:   { min: -2.0, max: 2.0, center: 0 },
      channel: { min: -3.3, max: -2.4, center: -2.9775 },
      bonnet:  { min: 2.35, max: 2.95, center: 2.6575 }
    };

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(6, 4, 10); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x172231, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = true;
    controls.panSpeed = 1.0;
    controls.target.set(0, 0, 0);

    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.PAN,
      RIGHT: THREE.MOUSE.DOLLY
    };

    scene.add(new THREE.HemisphereLight(0xe5efff, 0x38404b, 2.1));
    const dirLight = new THREE.DirectionalLight(0xfff4e6, 3.2);
    dirLight.position.set(15, 25, 20);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0xb9d8ff, 2.2);
    fillLight.position.set(-8, 3, -6);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffffff, 2.6);
    rimLight.position.set(2, -2, 8);
    scene.add(rimLight);

    const shellMat = new THREE.MeshStandardMaterial({ color: 0xa5b0b9, roughness: 0.38, metalness: 0.55 });
    const flangeMatBase = new THREE.MeshStandardMaterial({ color: 0x788693, roughness: 0.29, metalness: 0.65 });
    const nozzleMatBase = new THREE.MeshStandardMaterial({ color: 0x8a9ba7, roughness: 0.34, metalness: 0.55 });
    const studMat = new THREE.MeshStandardMaterial({color: 0x343c46, roughness: 0.38, metalness: 0.7});
    const nutMat = new THREE.MeshStandardMaterial({color: 0xa6adb5, roughness: 0.26, metalness: 0.7});
    const gasketMat = new THREE.MeshStandardMaterial({color: 0x158447, roughness: 0.48, metalness: 0.25});
    const gasketSteelMat = new THREE.MeshStandardMaterial({color: 0xc0c8ce, roughness: 0.3, metalness: 0.75});
    const weldMat = new THREE.MeshStandardMaterial({color: 0x7c8790, roughness: 0.55, metalness: 0.5});
    const partitionMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.5, metalness: 0.6 });
    const plugMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.25, metalness: 0.85 }); 
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x050505 }); 

    const heatExchanger = new THREE.Group();
    scene.add(heatExchanger);

    // Detalles visuales orientativos; no representan un patrón normativo de pernos.
    function ringX(parent, x, radius, tube, material) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 8, 96), material);
      ring.rotation.y = Math.PI / 2;
      ring.position.x = x;
      parent.add(ring);
      return ring;
    }
    function cylinderX(parent, x, radius, thickness, material) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thickness, 96), material);
      mesh.rotation.z = Math.PI / 2;
      mesh.position.x = x;
      parent.add(mesh);
      return mesh;
    }
    function spiralGasket(parent, x) {
      const gasket = new THREE.Group();
      gasket.name = 'Junta espirometalica: aro verde y espiral inoxidable';
      function annulus(inner, outer, thickness, material) {
        const points = [[inner, -thickness / 2], [outer, -thickness / 2],
          [outer, thickness / 2], [inner, thickness / 2], [inner, -thickness / 2]]
          .map(([r, axial]) => new THREE.Vector2(r, axial));
        const mesh = new THREE.Mesh(new THREE.LatheGeometry(points, 96), material);
        mesh.rotation.z = -Math.PI / 2;
        gasket.add(mesh);
      }
      annulus(0.518, 0.533, GASKET_T * 0.75, gasketSteelMat);
      annulus(0.533, 0.562, GASKET_T, gasketSteelMat);
      annulus(0.562, 0.583, GASKET_T * 0.65, gasketMat);
      // Espiral visible en ambas caras del anillo de sellado.
      for (const side of [-1, 1]) {
        const points = [];
        for (let i = 0; i <= 600; i++) {
          const fraction = i / 600;
          const angle = fraction * Math.PI * 2 * 8;
          const r = 0.534 + fraction * 0.026;
          points.push(new THREE.Vector3(side * (GASKET_T / 2 + 0.0001), r * Math.cos(angle), r * Math.sin(angle)));
        }
        gasket.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
          new THREE.LineBasicMaterial({color: 0x576873})));
      }
      gasket.position.x = x;
      parent.add(gasket);
    }
    function studCircle(parent, leftFace, rightFace, count = 20, pitchRadius = 0.603) {
      const shaftRadius = 0.014, nutHeight = 0.026;
      const shaftLength = rightFace - leftFace + 0.094;
      const groups = [
        {geo: new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 12), mat: studMat, positions: []},
        {geo: new THREE.CylinderGeometry(0.026, 0.026, nutHeight, 6), mat: nutMat, positions: []},
        {geo: new THREE.TorusGeometry(shaftRadius, 0.0015, 4, 12), mat: nutMat, positions: [], torus: true}
      ];
      for (let i = 0; i < count; i++) {
        const angle = (i + 0.5) * Math.PI * 2 / count;
        const y = Math.cos(angle) * pitchRadius, z = Math.sin(angle) * pitchRadius;
        groups[0].positions.push([(leftFace + rightFace) / 2, y, z]);
        for (const [face, sign] of [[leftFace, -1], [rightFace, 1]]) {
          groups[1].positions.push([face + sign * nutHeight / 2, y, z]);
          // Anillos finos simulan los filetes visibles en los extremos del espárrago.
          for (let t = 0; t < 5; t++) groups[2].positions.push([face + sign * (0.028 + t * 0.0035), y, z]);
        }
      }
      const transform = new THREE.Object3D();
      for (const part of groups) {
        const mesh = new THREE.InstancedMesh(part.geo, part.mat, part.positions.length);
        part.positions.forEach((pos, index) => {
          transform.position.set(...pos);
          transform.rotation.set(0, part.torus ? Math.PI / 2 : 0, part.torus ? 0 : Math.PI / 2);
          transform.updateMatrix();
          mesh.setMatrixAt(index, transform.matrix);
        });
        mesh.instanceMatrix.needsUpdate = true;
        parent.add(mesh);
      }
    }

    const shell = new THREE.Mesh(new THREE.CylinderGeometry(R, R, L_SHELL, 96), shellMat);
    shell.rotation.z = Math.PI / 2;
    heatExchanger.add(shell);

    const flangeGeo = new THREE.CylinderGeometry(R_FLANGE, R_FLANGE, T_FLANGE, 96);
    const flangeRight = new THREE.Mesh(flangeGeo, flangeMatBase);
    flangeRight.rotation.z = Math.PI / 2;
    flangeRight.position.x = FLANGE_SHELL_R_X;
    heatExchanger.add(flangeRight);
    
    const flangeLeft = new THREE.Mesh(flangeGeo, flangeMatBase);
    flangeLeft.rotation.z = Math.PI / 2;
    flangeLeft.position.x = FLANGE_SHELL_L_X;
    heatExchanger.add(flangeLeft);
    for (const x of [-2.13, 2.13, -0.7, 0.7]) ringX(heatExchanger, x, R, 0.006, weldMat);
    for (const x of [FLANGE_SHELL_R_X, FLANGE_SHELL_L_X]) {
      ringX(heatExchanger, x - 0.053, R_FLANGE, 0.003, nutMat);
      ringX(heatExchanger, x + 0.053, R_FLANGE, 0.003, nutMat);
    }

    function createTextSprite(initialText, color = 'white', fontSize = 32) {
      const canvas = document.createElement('canvas');
      canvas.width = 300; 
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }); 
      const sprite = new THREE.Sprite(spriteMat);
      
      sprite.userData.baseScaleX = 1.0;
      sprite.userData.baseScaleY = 0.4;
      sprite.scale.set(sprite.userData.baseScaleX, sprite.userData.baseScaleY, 1);

      sprite.updateText = function(text) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(!text || text.trim() === "") {
          texture.needsUpdate = true;
          return;
        }
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'black'; 
        ctx.strokeText(text, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = color;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        texture.needsUpdate = true;
      };

      sprite.updateText(initialText);
      return sprite;
    }

    const rearBonnetGroup = new THREE.Group();
    // Bonete completo: brida de base solidaria al cuerpo y fondo elíptico.
    // La cara x=0 se aperna a la brida del shell. No hay tapa desmontable.
    // Perfil elíptico ilustrativo 2:1; ajustar con dimensiones reales si se dispone de plano.
    const bonnetHeadDepth = R / 2;
    const bonnetProfile = [
      new THREE.Vector2(0, 0),
      new THREE.Vector2(R, 0),
      new THREE.Vector2(R, 0.8)
    ];
    for (let i = 1; i <= 32; i++) {
      const angle = i * Math.PI / 64;
      bonnetProfile.push(new THREE.Vector2(
        i === 32 ? 0 : R * Math.cos(angle),
        0.8 + bonnetHeadDepth * Math.sin(angle)
      ));
    }
    const bonnetBody = new THREE.Mesh(new THREE.LatheGeometry(bonnetProfile, 96), shellMat);
    bonnetBody.rotation.z = -Math.PI / 2;
    rearBonnetGroup.add(bonnetBody);
    const bonnetFlange = new THREE.Mesh(flangeGeo, flangeMatBase);
    bonnetFlange.rotation.z = Math.PI / 2;
    bonnetFlange.position.x = T_FLANGE / 2;
    rearBonnetGroup.add(bonnetFlange);
    for (const x of [0.007, T_FLANGE - 0.007]) ringX(rearBonnetGroup, x, R_FLANGE, 0.003, nutMat);
    spiralGasket(rearBonnetGroup, -GASKET_T / 2);
    studCircle(rearBonnetGroup, -T_FLANGE - GASKET_T, T_FLANGE);

    function createBonnetPlug(yPos, rotZ) {
      const plugGroup = new THREE.Group();
      const coupling = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.1, 24), flangeMatBase);
      plugGroup.add(coupling);
      const threadedBody = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.04, 24), plugMat);
      threadedBody.position.y = 0.07; 
      plugGroup.add(threadedBody);
      const elongatedHead = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.12, 24), plugMat);
      elongatedHead.position.y = 0.15; 
      plugGroup.add(elongatedHead);

      plugGroup.position.set(0.4, yPos, 0); 
      plugGroup.rotation.z = rotZ;
      return plugGroup;
    }

    const ventPlug = createBonnetPlug(NOZZLE_Y, 0);             
    const drainPlug = createBonnetPlug(-NOZZLE_Y, Math.PI);       
    rearBonnetGroup.add(ventPlug);
    rearBonnetGroup.add(drainPlug);
    rearBonnetGroup.position.x = BONNET_GRP_X;
    heatExchanger.add(rearBonnetGroup);

    const channelGroup = new THREE.Group();
    const channelBody = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 1.2, 96), shellMat);
    channelBody.rotation.z = Math.PI / 2;
    channelBody.position.x = -0.72;
    channelGroup.add(channelBody);
    const channelInnerFlange = new THREE.Mesh(flangeGeo, flangeMatBase);
    channelInnerFlange.rotation.z = Math.PI / 2;
    channelInnerFlange.position.x = -0.06;
    channelGroup.add(channelInnerFlange);
    const channelOuterFlange = new THREE.Mesh(flangeGeo, flangeMatBase);
    channelOuterFlange.rotation.z = Math.PI / 2;
    channelOuterFlange.position.x = -1.38;
    channelGroup.add(channelOuterFlange);
    const coverPlate = new THREE.Mesh(new THREE.CylinderGeometry(R_FLANGE, R_FLANGE, 0.1, 96), flangeMatBase);
    coverPlate.rotation.z = Math.PI / 2;
    coverPlate.position.x = -1.49 - GASKET_T;
    channelGroup.add(coverPlate);
    spiralGasket(channelGroup, -1.44 - GASKET_T / 2);
    studCircle(channelGroup, -1.54 - GASKET_T, -1.32);
    studCircle(channelGroup, -T_FLANGE, T_FLANGE + GASKET_T);
    spiralGasket(channelGroup, GASKET_T / 2);
    ringX(channelGroup, -1.31, R, 0.009, weldMat);
    ringX(channelGroup, -0.13, R, 0.009, weldMat);
    ringX(channelGroup, -1.542 - GASKET_T, R_FLANGE - 0.02, 0.003, nutMat);
    const partitionPlate = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.02, 1.09), partitionMat);
    partitionPlate.position.x = -0.72;
    channelGroup.add(partitionPlate);
    channelGroup.position.x = CHANNEL_GRP_X; 
    heatExchanger.add(channelGroup);

    const modelAParts = [...heatExchanger.children];
    const modelB = new THREE.Group();
    modelB.name = 'Modelo B: transición cónica y cabezal reducido';
    heatExchanger.add(modelB);
    modelB.visible = false;
    const RB = 0.72;
    cylinderX(modelB, 0, RB, 4.5, shellMat);
    // Reductor concéntrico: extremo menor a la izquierda.
    const coneProfile = [[0, -3.15], [0.36, -3.15], [RB, -2.25], [0, -2.25]]
      .map(([r, x]) => new THREE.Vector2(r, x));
    const cone = new THREE.Mesh(new THREE.LatheGeometry(coneProfile, 96), shellMat);
    cone.rotation.z = -Math.PI / 2;
    modelB.add(cone);
    ringX(modelB, -2.25, RB, 0.007, weldMat);
    cylinderX(modelB, -3.21, 0.45, 0.12, flangeMatBase);
    cylinderX(modelB, -3.342, 0.45, 0.12, flangeMatBase);
    const smallJoint = new THREE.Group();
    smallJoint.scale.set(1, 0.67, 0.67);
    modelB.add(smallJoint);
    spiralGasket(smallJoint, -3.276);
    studCircle(modelB, -3.402, -3.15, 16, 0.408);
    cylinderX(modelB, -3.50, 0.36, 0.46, shellMat);
    const smallHead = new THREE.Mesh(new THREE.SphereGeometry(0.36, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), shellMat);
    smallHead.rotation.z = Math.PI / 2;
    smallHead.scale.y = 0.6;
    smallHead.position.x = -3.73;
    modelB.add(smallHead);
    cylinderX(modelB, 2.25, 0.82, 0.12, flangeMatBase);
    cylinderX(modelB, 2.382, 0.82, 0.12, flangeMatBase);
    const largeJoint = new THREE.Group();
    largeJoint.scale.set(1, 1.29, 1.29);
    modelB.add(largeJoint);
    spiralGasket(largeJoint, 2.316);
    studCircle(modelB, 2.19, 2.442, 24, 0.773);
    const bigHead = new THREE.Mesh(new THREE.SphereGeometry(RB, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), shellMat);
    bigHead.rotation.z = -Math.PI / 2;
    bigHead.scale.y = 0.5;
    bigHead.position.x = 2.442;
    modelB.add(bigHead);
    for (const x of [-1.2, 1.1]) {
      const saddle = new THREE.Group();
      const cradle = new THREE.Mesh(new THREE.TorusGeometry(RB + 0.018, 0.045, 8, 48, Math.PI), flangeMatBase);
      cradle.rotation.set(0, Math.PI / 2, Math.PI);
      // Soportes laterales y placa de anclaje bajo el cuerpo.
      for (const z of [-0.45, 0.45]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.43, 0.09), flangeMatBase);
        leg.position.set(0, -0.76, z);
        saddle.add(leg);
      }
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.055, 1.12), flangeMatBase);
      base.position.y = -0.99;
      saddle.add(base);
      saddle.add(cradle);
      saddle.position.x = x;
      modelB.add(saddle);
    }
    function surfaceY(x) {
      if (currentModel === 'A') return NOZZLE_Y;
      if (x < -3.15) return 0.35;
      if (x < -2.25) return 0.36 + (x + 3.15) / 0.9 * 0.36 - 0.01;
      if (x > 2.442) return RB * Math.sqrt(Math.max(0.05, 1 - ((x - 2.442) / 0.36) ** 2)) - 0.01;
      return RB - 0.01;
    }
    function applyModel(model, reposition = false) {
      currentModel = model === 'B' ? 'B' : 'A';
      document.getElementById('equipment-model').value = currentModel;
      modelAParts.forEach(part => part.visible = currentModel === 'A');
      modelB.visible = currentModel === 'B';
      BODY_BOUNDS.channel = currentModel === 'B'
        ? {min: -3.65, max: -3.42, center: -3.5}
        : {min: -3.3, max: -2.4, center: -2.9775};
      BODY_BOUNDS.bonnet = currentModel === 'B'
        ? {min: 2.46, max: 2.7, center: 2.57}
        : {min: 2.35, max: 2.95, center: 2.6575};
      nozzlesList.forEach(nozzle => {
        const data = nozzle.userData;
        const bounds = BODY_BOUNDS[data.bodyPart];
        if (reposition && bounds && (data.valX < bounds.min || data.valX > bounds.max)) data.valX = bounds.center;
        nozzle.position.x = data.valX;
        nozzle.position.y = surfaceY(data.valX) * (data.pos === 'superior' ? 1 : -1);
      });
      nameplate.position.z = (currentModel === 'B' ? RB : R) + 0.02;
      if (reposition && selectedNozzle) {
        const activeNozzle = selectedNozzle;
        deselectNozzle();
        selectNozzle(activeNozzle);
      }
    }

    function createNozzlePlug(colorMat) {
      const plugGroup = new THREE.Group();
      const coupling = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.06, 24), colorMat);
      coupling.position.y = 0.03; 
      plugGroup.add(coupling);
      const threadedBody = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.02, 24), plugMat);
      threadedBody.position.y = 0.07;
      plugGroup.add(threadedBody);
      const elongatedHead = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.08, 24), plugMat);
      elongatedHead.position.y = 0.12;
      plugGroup.add(elongatedHead);
      return plugGroup;
    }

    function buildNozzle(internalName, tagText, diaIndex, rating, bodyPart, pos, posX, hasNS, tagNS, hasFS, tagFS) {
      const group = new THREE.Group();
      const dIndex = diaIndex !== undefined ? parseInt(diaIndex) : 4;
      
      group.userData = {
        isNozzle: true, idName: internalName, tagName: tagText,
        diaIndex: dIndex, rating: rating, bodyPart: bodyPart, pos: pos,      
        valX: posX, valY: NOZZLE_Y, 
        hasNS: hasNS, tagNS: tagNS, hasFS: hasFS, tagFS: tagFS
      };

      const nzMat = nozzleMatBase.clone();
      const flMat = flangeMatBase.clone();
      group.userData.materials = [nzMat, flMat]; 
      
      const pOuter = 0.12;
      const pInner = 0.09;
      const nTop = 0.14;
      const fOuter = 0.22;
      const pHeight = 0.15;
      const nHeight = 0.08;
      const fThick = 0.03;

      const tubeProfile = [
        [pInner, 0], [pOuter, 0], [pOuter, pHeight],
        [nTop, pHeight + nHeight], [pInner, pHeight + nHeight], [pInner, 0]
      ].map(([x, y]) => new THREE.Vector2(x, y));
      const pipe = new THREE.Mesh(new THREE.LatheGeometry(tubeProfile, 48), nzMat);
      group.add(pipe);

      const flangeShape = new THREE.Shape();
      flangeShape.absarc(0, 0, fOuter, 0, Math.PI * 2, false);
      const bore = new THREE.Path();
      bore.absarc(0, 0, pInner, 0, Math.PI * 2, true);
      flangeShape.holes.push(bore);
      for (let i = 0; i < 8; i++) {
        const angle = (i + 0.5) * Math.PI / 4;
        const hole = new THREE.Path();
        hole.absarc(Math.cos(angle) * 0.18, Math.sin(angle) * 0.18, 0.014, 0, Math.PI * 2, true);
        flangeShape.holes.push(hole);
      }
      const flange = new THREE.Mesh(new THREE.ExtrudeGeometry(flangeShape, {
        depth: fThick, bevelEnabled: true, bevelThickness: 0.0015,
        bevelSize: 0.0015, bevelSegments: 1, steps: 1, curveSegments: 32
      }), flMat);
      flange.rotation.x = -Math.PI / 2;
      flange.position.y = pHeight + nHeight;
      group.add(flange);

      const totalH = pHeight + nHeight + fThick;
      const faceProfile = [[pInner, totalH], [0.145, totalH],
        [0.145, totalH + 0.008], [pInner, totalH + 0.008], [pInner, totalH]]
        .map(([x, y]) => new THREE.Vector2(x, y));
      group.add(new THREE.Mesh(new THREE.LatheGeometry(faceProfile, 48), flMat));
      // Fondo oscuro dentro del conducto, sin tapar la boca de la brida.
      const hole = new THREE.Mesh(new THREE.CircleGeometry(pInner, 32), holeMat);
      hole.rotation.x = -Math.PI / 2;
      hole.position.y = 0.003;
      group.add(hole);
      const baseWeld = new THREE.Mesh(new THREE.TorusGeometry(pOuter, 0.008, 8, 48), weldMat);
      baseWeld.rotation.x = Math.PI / 2;
      baseWeld.position.y = 0.007;
      group.add(baseWeld);

      const plugNS = createNozzlePlug(flMat);
      plugNS.rotation.x = Math.PI / 2; 
      plugNS.position.set(0, pHeight / 2, pOuter);  
      plugNS.visible = hasNS;
      group.add(plugNS);
      group.userData.plugNS = plugNS;

      const plugFS = createNozzlePlug(flMat);
      plugFS.rotation.x = -Math.PI / 2; 
      plugFS.position.set(0, pHeight / 2, -pOuter);  
      plugFS.visible = hasFS;
      group.add(plugFS);
      group.userData.plugFS = plugFS;

      const nozzleSprite = createTextSprite(tagText, 'white', 40);
      nozzleSprite.position.set(0, totalH + 0.2, 0);
      group.add(nozzleSprite);
      group.userData.nozzleSprite = nozzleSprite;

      const scaleFactor = 0.3 + (dIndex * 0.1);
      group.scale.set(scaleFactor, scaleFactor, scaleFactor);

      if(pos === 'superior') {
        group.position.set(posX, surfaceY(posX), 0);
        group.rotation.z = 0;
      } else {
        group.position.set(posX, -surfaceY(posX), 0);
        group.rotation.z = Math.PI;
      }

      heatExchanger.add(group);
      return group;
    }

    function loadExchangerData(data) {
      applyModel(data.model);
      currentNameplate = data.nameplate || "";
      document.getElementById("nameplate-input").value = currentNameplate;
      updateNameplateText(currentNameplate);
      
      document.getElementById('vent-input').value = data.vent || "";
      document.getElementById('drain-input').value = data.drain || "";

      nozzlesList.forEach(nz => heatExchanger.remove(nz));
      nozzlesList = [];
      customNozzleCount = 0;

      if(data.nozzles) {
        data.nozzles.forEach(n => {
          customNozzleCount++;
          const internalName = `Nozzle_${customNozzleCount}`;
          const newNz = buildNozzle(internalName, n.tagName, n.diaIndex, n.rating, n.bodyPart, n.pos, n.valX, n.hasNS, n.tagNS, n.hasFS, n.tagFS);
          nozzlesList.push(newNz);
        });
      }
      deselectNozzle();
      syncStateToParent();
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedNozzle = null;

    window.addEventListener('pointerdown', (event) => {
      if (readOnly || saving) return;
      if (event.target.closest('#ui-container, #toggle-equipment-panel')) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(heatExchanger.children, true);
      let clickedNozzle = null;

      for (let i = 0; i < intersects.length; i++) {
        let obj = intersects[i].object;
        while (obj && obj !== heatExchanger) {
          if (obj.userData && obj.userData.isNozzle) {
            clickedNozzle = obj;
            break;
          }
          obj = obj.parent;
        }
        if (clickedNozzle) break;
      }

      if (clickedNozzle) selectNozzle(clickedNozzle);
      else deselectNozzle();
    });

    function selectNozzle(nozzle) {
      if (selectedNozzle === nozzle) return;
      deselectNozzle();
      selectedNozzle = nozzle;
      selectedNozzle.userData.materials.forEach(mat => mat.emissive.setHex(0x1a4b6e));

      const data = selectedNozzle.userData;
      document.getElementById('editor-panel').style.display = 'block';
      document.getElementById('edit-nz-name').value = data.tagName;
      document.getElementById('edit-nz-dia').selectedIndex = data.diaIndex;
      document.getElementById('edit-nz-rating').value = data.rating;
      document.getElementById('edit-nz-body').value = data.bodyPart;
      
      const bounds = BODY_BOUNDS[data.bodyPart];
      const editX = document.getElementById('edit-nz-x');
      editX.min = bounds.min;
      editX.max = bounds.max;
      editX.value = data.valX;
      
      document.getElementById('edit-nz-pos').value = data.pos;
      document.getElementById('edit-ns-check').checked = data.hasNS;
      document.getElementById('edit-ns-name').value = data.tagNS;
      document.getElementById('edit-ns-name').disabled = !data.hasNS;
      document.getElementById('edit-fs-check').checked = data.hasFS;
      document.getElementById('edit-fs-name').value = data.tagFS;
      document.getElementById('edit-fs-name').disabled = !data.hasFS;
    }

    function deselectNozzle() {
      if (selectedNozzle) {
        selectedNozzle.userData.materials.forEach(mat => mat.emissive.setHex(0x000000));
        selectedNozzle = null;
      }
      document.getElementById('editor-panel').style.display = 'none';
    }

    const editName = document.getElementById('edit-nz-name');
    const editDia = document.getElementById('edit-nz-dia');
    const editRating = document.getElementById('edit-nz-rating');
    const editBody = document.getElementById('edit-nz-body');
    const editPos = document.getElementById('edit-nz-pos');
    const editX = document.getElementById('edit-nz-x');
    
    const editNsCheck = document.getElementById('edit-ns-check');
    const editNsName = document.getElementById('edit-ns-name');
    const editFsCheck = document.getElementById('edit-fs-check');
    const editFsName = document.getElementById('edit-fs-name');

    editName.addEventListener('input', (e) => {
      if(!selectedNozzle) return;
      const val = e.target.value;
      selectedNozzle.userData.tagName = val;
      selectedNozzle.userData.nozzleSprite.updateText(val);
      syncStateToParent();
    });

    editDia.addEventListener('change', (e) => {
      if(!selectedNozzle) return;
      const diaIndex = e.target.selectedIndex;
      selectedNozzle.userData.diaIndex = diaIndex;
      const scaleFactor = 0.3 + (diaIndex * 0.1);
      selectedNozzle.scale.set(scaleFactor, scaleFactor, scaleFactor);
      syncStateToParent();
    });

    editRating.addEventListener('change', (e) => {
      if(!selectedNozzle) return;
      selectedNozzle.userData.rating = e.target.value;
      syncStateToParent();
    });

    editBody.addEventListener('change', (e) => {
      if(!selectedNozzle) return;
      const newBody = e.target.value;
      selectedNozzle.userData.bodyPart = newBody;
      const bounds = BODY_BOUNDS[newBody];
      editX.min = bounds.min;
      editX.max = bounds.max;
      editX.value = bounds.center; 
      selectedNozzle.userData.valX = bounds.center;
      updateTransform();
      syncStateToParent();
    });

    const updateTransform = () => {
      if(!selectedNozzle) return;
      const pos = editPos.value;
      const vx = parseFloat(editX.value);
      selectedNozzle.userData.pos = pos;
      selectedNozzle.userData.valX = vx;

      if (pos === 'superior') {
        selectedNozzle.position.set(vx, surfaceY(vx), 0);
        selectedNozzle.rotation.z = 0;
      } else {
        selectedNozzle.position.set(vx, -surfaceY(vx), 0);
        selectedNozzle.rotation.z = Math.PI;
      }
      syncStateToParent();
    };
    
    editPos.addEventListener('change', updateTransform);
    editX.addEventListener('input', updateTransform);

    editNsCheck.addEventListener('change', (e) => {
      if(!selectedNozzle) return;
      const isChecked = e.target.checked;
      selectedNozzle.userData.hasNS = isChecked;
      selectedNozzle.userData.plugNS.visible = isChecked;
      editNsName.disabled = !isChecked;
      syncStateToParent();
    });
    editNsName.addEventListener('input', (e) => {
      if(!selectedNozzle) return;
      selectedNozzle.userData.tagNS = e.target.value;
      syncStateToParent();
    });

    editFsCheck.addEventListener('change', (e) => {
      if(!selectedNozzle) return;
      const isChecked = e.target.checked;
      selectedNozzle.userData.hasFS = isChecked;
      selectedNozzle.userData.plugFS.visible = isChecked;
      editFsName.disabled = !isChecked;
      syncStateToParent();

    editFsName.addEventListener('input', (e) => {

    document.getElementById('btn-delete-nz').addEventListener('click', () => {

      syncStateToParent();

    document.getElementById('btn-add-nz').addEventListener('click', () => {
      customNozzleCount++;
      const diaSelect = document.getElementById('new-nz-dia');
      const diaIndex = Array.from(editDia.options).findIndex(option => option.value === diaSelect.value); 
      const rating = document.getElementById('new-nz-rating').value;
      const bodyPart = document.getElementById('new-nz-body').value;
      const internalName = `Custom_Nozzle_${customNozzleCount}`;
      const startX = BODY_BOUNDS[bodyPart].center;

      const newNz = buildNozzle(internalName, "", diaIndex, rating, bodyPart, "superior", startX, false, "", false, "");

    const nameCanvas = document.createElement('canvas');
    nameCanvas.width = 1024;
    nameCanvas.height = 384; 
    const ctx = nameCanvas.getContext('2d');
    let plateTexture = new THREE.CanvasTexture(nameCanvas);

    function updateNameplateText(text) {
      ctx.clearRect(0, 0, nameCanvas.width, nameCanvas.height);
      if(!text || text.trim() === "") {
        plateTexture.needsUpdate = true;
        return; 
      }

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, nameCanvas.width, nameCanvas.height);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 24;
      ctx.strokeRect(0, 0, nameCanvas.width, nameCanvas.height);
      
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(45, 45, 15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(nameCanvas.width-45, 45, 15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(45, nameCanvas.height-45, 15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(nameCanvas.width-45, nameCanvas.height-45, 15, 0, Math.PI*2); ctx.fill();

      ctx.font = 'bold 120px sans-serif'; 
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeText(text, nameCanvas.width / 2, nameCanvas.height / 2);
      ctx.fillStyle = '#000000';
      ctx.fillText(text, nameCanvas.width / 2, nameCanvas.height / 2);
      
      plateTexture.needsUpdate = true;
    }

    const plateMat = new THREE.MeshStandardMaterial({ map: plateTexture, metalness: 0.5, roughness: 0.3, transparent: true });
    const nameplate = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.52, 0.02), plateMat);
    nameplate.position.set(0, 0, R + 0.02); 
    heatExchanger.add(nameplate);

    document.getElementById('vent-input').addEventListener('input', () => syncStateToParent());
    document.getElementById('drain-input').addEventListener('input', () => syncStateToParent());

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
    document.getElementById('equipment-model').addEventListener('change', event => {
      applyModel(event.target.value, true);
      syncStateToParent();
    });
    document.getElementById('nameplate-input').addEventListener('input', event => {
      currentNameplate = event.target.value;
      updateNameplateText(currentNameplate);
      syncStateToParent();
    });
    document.getElementById('save-equipment').addEventListener('click', () => {
      if (saving || !initialized) return;
      if (!currentNameplate.trim()) {
        document.getElementById('save-status').textContent = 'Debes ingresar el TAG del equipo.';
        return;
      }
      currentNameplate = currentNameplate.trim();
      document.getElementById('nameplate-input').value = currentNameplate;
      updateNameplateText(currentNameplate);
      saving = true;
      document.querySelectorAll('#ui-container input, #ui-container select, #ui-container button').forEach(el => el.disabled = true);
      document.getElementById('save-status').textContent = 'Guardando y verificando en Sheets...';
      syncStateToParent('save');
    });
    window.exchangerBridge.attach(args => {
      readOnly = Boolean(args.readonly);
      window.exchangerBridge.setReadOnly(readOnly);
      if (!initialized) {
        loading = true;
        loadExchangerData(args.initial_data);
        loading = false;
        initialized = true;
        document.getElementById('save-equipment').disabled = readOnly;
        clearTimeout(window.exchangerBridge.timer);
        document.getElementById('save-status').textContent = 'Visor listo.';
      }
      if (args.ack && args.ack.event_id === pendingSave) {
        saving = false;
        pendingSave = null;
        document.querySelectorAll('#ui-container input, #ui-container select, #ui-container button').forEach(el => el.disabled = false);
        editNsName.disabled = !editNsCheck.checked;
        editFsName.disabled = !editFsCheck.checked;
        document.getElementById('save-status').textContent = args.ack.message;
      }
      send('streamlit:setFrameHeight', {height: args.height || 720});
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    } catch (error) {
      window.exchangerBridge.fail(error);
    }
  </script>
</body>
</html>
