<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor 3D Interactivo</title>
  <style>
    body { margin: 0; background: transparent; color: inherit; font-family: sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    #info { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.65); padding: 8px 12px; border-radius: 6px; border: 1px solid #444; text-align: right; pointer-events: none; color: #fff;}
    
    #ui-container { 
      position: absolute; top: 52px; left: 10px; z-index: 10; 
      background: rgba(15, 23, 42, 0.9); padding: 10px; border-radius: 6px; 
      border: 1px solid #475569; width: 240px; max-height: calc(100vh - 84px); overflow-y: auto; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #f8fafc;
    }
    #ui-container::-webkit-scrollbar { width: 4px; }
    #ui-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
    #toggle-equipment-panel {
      position: absolute; top: 10px; left: 10px; z-index: 20;
      padding: 9px 12px; border: 1px solid #475569; border-radius: 6px;
      background: #0f172a; color: #f8fafc; font-size: 12px;
      font-weight: bold; cursor: pointer;
    }
    #toggle-equipment-panel:hover { background: #1e293b; border-color: #38bdf8; }
    #toggle-equipment-panel:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
    
    .panel-title { font-size: 12px; font-weight: bold; margin-top: 0; margin-bottom: 8px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 3px; }
    .input-group { margin-bottom: 6px; }
    .input-group label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
    .input-group input[type="text"], .input-group select { width: 100%; box-sizing: border-box; padding: 4px; font-size: 11px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 3px; outline: none; }
    .input-group input[type="range"] { width: 100%; cursor: pointer; margin: 2px 0; }
    
    .plug-edit-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; background: rgba(0,0,0,0.2); padding: 3px; border-radius: 3px;}
    .plug-edit-row input[type="text"] { flex: 1; margin: 0; padding: 2px; font-size: 10px; }
    
    #btn-add-nz { width: 100%; padding: 6px; background: #38bdf8; color: #0f172a; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.2s; }
    #btn-add-nz:hover { background: #0284c7; color: #fff; }

    #btn-delete-nz { width: 100%; padding: 6px; background: #ef4444; color: #fff; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; transition: 0.2s; }
    #btn-delete-nz:hover { background: #b91c1c; }
    
    #editor-panel { display: none; background: rgba(56, 189, 248, 0.08); border: 1px solid #38bdf8; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    #editor-title { color: #38bdf8; font-weight: bold; margin-bottom: 6px; font-size: 11px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

  <div id="load-error" role="alert" style="display:none;position:absolute;bottom:12px;right:12px;max-width:440px;padding:12px;background:#7f1d1d;color:white;border-radius:6px;z-index:30;white-space:pre-wrap;font-size:12px"></div>

  <script>
    // La conexión con Streamlit no depende de Three.js ni de WebGL.
    (() => {
      const status = document.getElementById('save-status');
      const panel = document.getElementById('ui-container');
      const panelToggle = document.getElementById('toggle-equipment-panel');
      let panelCollapsed = false;
      let panelReadOnly = false;
      function updatePanel() {
        panel.style.display = panelReadOnly || panelCollapsed ? 'none' : '';
        panelToggle.hidden = panelReadOnly;
        panelToggle.setAttribute('aria-expanded', String(!panelReadOnly && !panelCollapsed));
        panelToggle.textContent = panelCollapsed ? 'Mostrar datos equipo' : 'Ocultar datos equipo';
      }
      panelToggle.addEventListener('click', () => {
        panelCollapsed = !panelCollapsed;
        updatePanel();
      });
      status.textContent = 'Conectando visor 3D...';
      const bridge = window.exchangerBridge = {
        args: null,
        render: null,
        setReadOnly(value) {
          panelReadOnly = Boolean(value);
          updatePanel();
        },
        send(type, fields) {
          window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, '*');
        },
        fail(error) {
          clearTimeout(bridge.timer);
          status.textContent = 'No se pudo iniciar el visor 3D: ' +
            (error && error.message ? error.message : String(error)) +
            '\nRecarga la página. Si persiste, copia este mensaje.';
          const errorBox = document.getElementById('load-error');
          errorBox.textContent = status.textContent;
          errorBox.style.display = 'block';
          console.error('Visor 3D:', error);
        },
        attach(render) {
          bridge.render = render;
          if (bridge.args) render(bridge.args);
        }
      };
      window.addEventListener('message', event => {
        if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
        bridge.args = event.data.args;
        bridge.setReadOnly(bridge.args.readonly);
        if (bridge.render) {
          try { bridge.render(bridge.args); } catch (error) { bridge.fail(error); }
        }
      });
      window.addEventListener('error', event => bridge.fail(event.error || event.message));
      window.addEventListener('unhandledrejection', event => bridge.fail(event.reason));
      bridge.timer = setTimeout(() => {
        status.textContent = 'La carga está tardando. Comprueba el acceso a cdn.jsdelivr.net y que WebGL esté disponible en el navegador.';
      }, 20000);
      bridge.send('streamlit:componentReady', {apiVersion: 1});
      bridge.send('streamlit:setFrameHeight', {height: 720});
    })();
  </script>

  <script type="module">
    try {
    const THREE = await import('three');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

    let initialized = false, loading = false, saving = false, readOnly = false;
    let revision = 0, pendingSave = null;
    const sessionId = globalThis.crypto?.randomUUID?.() ||
      Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    function send(type, fields) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, '*');
    }
    let currentNameplate = "";
    let currentModel = 'A';
    // Los primeros 11 índices conservan exactamente la tabla histórica.
    const DIAMETERS = ['1/2"', '3/4"', '1"', '1 1/2"', '2"', '3"', '4"',
      '6"', '8"', '10"', '12"', '2 1/2"', '14"', '16"', '18"', '20"', '24"'];
    const DIAMETER_INCHES = [0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8, 10, 12, 2.5, 14, 16, 18, 20, 24];
    const FLANGED_DIAMETER_INDEXES = [0, 1, 2, 3, 4, 11, 5, 6, 7, 8, 9, 10, 12, 13, 14, 15, 16];
    const THREADED_DIAMETER_INDEXES = [0, 1, 2, 3, 4, 11];

    function populateDiameterSelect(select, connectionType, selectedIndex) {
      const allowed = connectionType === 'threaded' ? THREADED_DIAMETER_INDEXES : FLANGED_DIAMETER_INDEXES;
      select.replaceChildren(...allowed.map(index => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = DIAMETERS[index];
        return option;
      }));
      const desired = allowed.includes(Number(selectedIndex)) ? Number(selectedIndex)
        : (connectionType === 'threaded' ? 0 : 6);
      select.value = String(desired);
    }

    function syncStateToParent(action = "change") {
      if (loading || !initialized || readOnly) return;
      const exportData = {
        model: currentModel,
        dimensions: {...currentDimensions, modelALengthsEnabled: true},
        nameplate: currentNameplate,
        vent: "",
        drain: "",
        nozzles: nozzlesList.map(nz => ({
          tagName: nz.userData.tagName || "",
          service: nz.userData.service || "process",
          connectionType: nz.userData.connectionType || "flanged",
          diaIndex: nz.userData.diaIndex !== undefined ? nz.userData.diaIndex : 4,
          rating: nz.userData.rating || (nz.userData.connectionType === 'threaded' ? "3000#" : "150#"),
          flangeType: "WN",
          face: nz.userData.face || "RF",
          bodyPart: nz.userData.bodyPart || "shell",
          pos: nz.userData.pos || "superior",
          valX: nz.userData.valX !== undefined ? nz.userData.valX : 0,
          hasNS: !!nz.userData.hasNS,
          sizeNS: nz.userData.sizeNS || "",
          tagNS: nz.userData.tagNS || "",
          hasFS: !!nz.userData.hasFS,
          sizeFS: nz.userData.sizeFS || "",
          tagFS: nz.userData.tagFS || ""
        }))
      };
      const eventId = sessionId + ':' + (++revision);
      if (action === 'save') pendingSave = eventId;
      send('streamlit:setComponentValue', {dataType: 'json', value: {
        event_id: eventId, action, data: exportData
      }});
    }

    let nozzlesList = [];
    let customNozzleCount = 0;

    const R = 0.549; 
    const L_SHELL = 4.275;
    const T_FLANGE = 0.12;
    const R_FLANGE = 0.65;
    
    const FLANGE_SHELL_R_X = 2.1975;
    const FLANGE_SHELL_L_X = -2.1975;
    const GASKET_T = 0.012; // Separación visual para distinguir la junta comprimida.
    const BONNET_GRP_X = 2.2575 + GASKET_T;
    const CHANNEL_GRP_X = -2.2575 - GASKET_T;
    const NOZZLE_Y = R - 0.01; 

    const BODY_BOUNDS = {
      shell:   { min: -2.0, max: 2.0, center: 0 },
      transition: { min: -2.0, max: 2.0, center: 0 },
      channel: { min: -3.3, max: -2.4, center: -2.9775 },
      bonnet:  { min: 2.35, max: 2.95, center: 2.6575 }
    };

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(6, 4, 10); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x172231, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = true;
    controls.panSpeed = 1.0;
    controls.target.set(0, 0, 0);

    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.PAN,
      RIGHT: THREE.MOUSE.DOLLY
    };

    scene.add(new THREE.HemisphereLight(0xe5efff, 0x38404b, 2.1));
    const dirLight = new THREE.DirectionalLight(0xfff4e6, 3.2);
    dirLight.position.set(15, 25, 20);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0xb9d8ff, 2.2);
    fillLight.position.set(-8, 3, -6);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0xffffff, 2.6);
    rimLight.position.set(2, -2, 8);
    scene.add(rimLight);

    const shellMat = new THREE.MeshStandardMaterial({ color: 0xa5b0b9, roughness: 0.38, metalness: 0.55 });
    const flangeMatBase = new THREE.MeshStandardMaterial({ color: 0x788693, roughness: 0.29, metalness: 0.65 });
    const nozzleMatBase = new THREE.MeshStandardMaterial({ color: 0x8a9ba7, roughness: 0.34, metalness: 0.55 });
    const studMat = new THREE.MeshStandardMaterial({color: 0x343c46, roughness: 0.38, metalness: 0.7});
    const nutMat = new THREE.MeshStandardMaterial({color: 0xa6adb5, roughness: 0.26, metalness: 0.7});
    const gasketMat = new THREE.MeshStandardMaterial({color: 0x158447, roughness: 0.48, metalness: 0.25});
    const gasketSteelMat = new THREE.MeshStandardMaterial({color: 0xc0c8ce, roughness: 0.3, metalness: 0.75});
    const weldMat = new THREE.MeshStandardMaterial({color: 0x7c8790, roughness: 0.55, metalness: 0.5});
    const partitionMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.5, metalness: 0.6 });
    const plugMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.25, metalness: 0.85 }); 
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x050505 }); 

    const heatExchanger = new THREE.Group();
    scene.add(heatExchanger);

    // Detalles visuales orientativos; no representan un patrón normativo de pernos.
    function ringX(parent, x, radius, tube, material) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 8, 96), material);
      ring.rotation.y = Math.PI / 2;
      ring.position.x = x;
      parent.add(ring);
      return ring;
    }
    function cylinderX(parent, x, radius, thickness, material) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thickness, 96), material);
      mesh.rotation.z = Math.PI / 2;
      mesh.position.x = x;
      parent.add(mesh);
      return mesh;
    }
    function spiralGasket(parent, x) {
      const gasket = new THREE.Group();
      gasket.name = 'Junta espirometalica: aro verde y espiral inoxidable';
      function annulus(inner, outer, thickness, material) {
        const points = [[inner, -thickness / 2], [outer, -thickness / 2],
          [outer, thickness / 2], [inner, thickness / 2], [inner, -thickness / 2]]
          .map(([r, axial]) => new THREE.Vector2(r, axial));
        const mesh = new THREE.Mesh(new THREE.LatheGeometry(points, 96), material);
        mesh.rotation.z = -Math.PI / 2;
        gasket.add(mesh);
      }
      annulus(0.518, 0.533, GASKET_T * 0.75, gasketSteelMat);
      annulus(0.533, 0.562, GASKET_T, gasketSteelMat);
      annulus(0.562, 0.583, GASKET_T * 0.65, gasketMat);
      // Espiral visible en ambas caras del anillo de sellado.
      for (const side of [-1, 1]) {
        const points = [];
        for (let i = 0; i <= 600; i++) {
          const fraction = i / 600;
          const angle = fraction * Math.PI * 2 * 8;
          const r = 0.534 + fraction * 0.026;
          points.push(new THREE.Vector3(side * (GASKET_T / 2 + 0.0001), r * Math.cos(angle), r * Math.sin(angle)));
        }
        gasket.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
          new THREE.LineBasicMaterial({color: 0x576873})));

      gasket.position.x = x;
      parent.add(gasket);

    function studCircle(parent, leftFace, rightFace, count = 20, pitchRadius = 0.603) {
      const shaftRadius = 0.014, nutHeight = 0.026;
      const shaftLength = rightFace - leftFace + 0.094;
      const groups = [
        {geo: new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 12), mat: studMat, positions: []},
        {geo: new THREE.CylinderGeometry(0.026, 0.026, nutHeight, 6), mat: nutMat, positions: []},
        {geo: new THREE.TorusGeometry(shaftRadius, 0.0015, 4, 12), mat: nutMat, positions: [], torus: true}
      ];
      for (let i = 0; i < count; i++) {
        const angle = (i + 0.5) * Math.PI * 2 / count;
        const y = Math.cos(angle) * pitchRadius, z = Math.sin(angle) * pitchRadius;
        groups[0].positions.push([(leftFace + rightFace) / 2, y, z]);
        for (const [face, sign] of [[leftFace, -1], [rightFace, 1]]) {
          groups[1].positions.push([face + sign * nutHeight / 2, y, z]);
          // Anillos finos simulan los filetes visibles en los extremos del espárrago.
          for (let t = 0; t < 5; t++) groups[2].positions.push([face + sign * (0.028 + t * 0.0035), y, z]);
        }
      }
      const transform = new THREE.Object3D();
      for (const part of groups) {
        const mesh = new THREE.InstancedMesh(part.geo, part.mat, part.positions.length);
        part.positions.forEach((pos, index) => {
          transform.position.set(...pos);
          transform.rotation.set(0, part.torus ? Math.PI / 2 : 0, part.torus ? 0 : Math.PI / 2);
          transform.updateMatrix();
          mesh.setMatrixAt(index, transform.matrix);
        });
        mesh.instanceMatrix.needsUpdate = true;
        parent.add(mesh);
      }

      const canvas = document.createElement('canvas');

      const ctx = canvas.getContext('2d');
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }); 
      const sprite = new THREE.Sprite(spriteMat);
      
      sprite.userData.baseScaleX = 1.0;
      sprite.userData.baseScaleY = 0.4;
      sprite.scale.set(sprite.userData.baseScaleX, sprite.userData.baseScaleY, 1);

      sprite.updateText = function(text) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(!text || text.trim() === "") {
          texture.needsUpdate = true;
          return;
        }
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'black'; 
        ctx.strokeText(text, canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = color;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        texture.needsUpdate = true;

    function modelBLayout() {
      const shellRadius = currentDimensions.shellDiameter / 2;
      const channelRadius = currentDimensions.channelDiameter / 2;
      const bonnetRadius = currentDimensions.bonnetDiameter / 2;
      const shellLeft = -currentDimensions.shellLength / 2;

      const channelBodyRight = reducerSmall - (2 * T_FLANGE + GASKET_T);

      return {shellLeft, shellRight, reducerSmall, channelBodyRight, channelBodyLeft,

    // Reductor excéntrico: la generatriz inferior queda recta y la superior
    // forma la diagonal hacia el cabezal de menor diámetro.
    function eccentricReducer(xSmall, xLarge, rSmall, rLarge, segments = 96) {
      const positions = [], indices = [];
      for (const [x, radius] of [[xSmall, rSmall], [xLarge, rLarge]]) {
        const centerY = -rLarge + radius; // Mantiene y inferior = -rLarge.
        for (let i = 0; i <= segments; i++) {
          const angle = i / segments * Math.PI * 2;
          positions.push(x, centerY + radius * Math.cos(angle), radius * Math.sin(angle));
        }
      }
      const stride = segments + 1;
      for (let i = 0; i < segments; i++) {
        const a = i, b = i + 1, c = stride + i, d = stride + i + 1;
        indices.push(a, c, b, b, c, d);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, shellMat);
    }

      // Reductor excéntrico: fondo recto y parte superior diagonal.

        coverJoint, 16, channelPitchRadius);
    }
    const dimensionControls = {

    function componentRadius(bodyPart) {
      if (bodyPart === 'channel') return currentDimensions.channelDiameter / 2;

    function sectionAt(x, bodyPart = 'shell') {
      if (currentModel !== 'B') {
        return {centerY: 0, radius: componentRadius(bodyPart)};

      const p = modelBLayout();
      if (bodyPart === 'channel' || x < p.reducerSmall) {
        return {centerY: p.channelY, radius: p.channelRadius};
      }
      if (bodyPart === 'transition' || x < p.shellLeft) {
        const radius = p.channelRadius + (x - p.reducerSmall) /
          currentDimensions.reducerLength * (p.shellRadius - p.channelRadius);
        return {centerY: -p.shellRadius + radius, radius};

      if (bodyPart === 'bonnet' || x > p.shellRight) {

      if (pos === 'inferior') {
        nozzle.position.y -= radius;
        nozzle.rotation.z = Math.PI;
      } else if (pos === 'front') {
        nozzle.position.z = radius;
        nozzle.rotation.x = Math.PI / 2;
      } else if (pos === 'rear') {
        nozzle.position.z = -radius;
        nozzle.rotation.x = -Math.PI / 2;

    function createNozzlePlug(colorMat) {
      const plugGroup = new THREE.Group();
      const coupling = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.06, 24), colorMat);
      coupling.position.y = 0.03; 
      plugGroup.add(coupling);
      const threadedBody = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.02, 24), plugMat);
      threadedBody.position.y = 0.07;
      plugGroup.add(threadedBody);
      const elongatedHead = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.08, 24), plugMat);
      elongatedHead.position.y = 0.12;
      plugGroup.add(elongatedHead);
      return plugGroup;
    }

    function buildNozzle(internalName, tagText, diaIndex, connectionType, rating, bodyPart, pos, posX,
      hasNS, sizeNS, tagNS, hasFS, sizeFS, tagFS, service = 'process', face = 'RF') {
      const group = new THREE.Group();
      const dIndex = diaIndex !== undefined ? parseInt(diaIndex) : 4;
      const type = connectionType === 'threaded' ? 'threaded' : 'flanged';
      const normalizedRating = type === 'threaded'
        ? (['3000#', '6000#'].includes(rating) ? rating : '3000#')
        : (['150#', '300#', '600#'].includes(rating) ? rating : '150#');
      
      group.userData = {
        isNozzle: true, idName: internalName, tagName: tagText,
        diaIndex: dIndex, connectionType: type, rating: normalizedRating, service: service,
        flangeType: 'WN', face: face === 'FF' ? 'FF' : 'RF', bodyPart: bodyPart, pos: pos,
        valX: posX, valY: NOZZLE_Y, 
        hasNS: hasNS, sizeNS: sizeNS, tagNS: tagNS,
        hasFS: hasFS, sizeFS: sizeFS, tagFS: tagFS
      };

      const nzMat = nozzleMatBase.clone();
      const flMat = flangeMatBase.clone();
      group.userData.materials = [nzMat, flMat]; 
      let totalH, plugNS, plugFS;
      if (type === 'threaded') {
        // Conexión roscada directa: copla, tramo roscado y cabeza hexagonal.
        const coupling = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.10, 32), nzMat);
        coupling.position.y = 0.05;
        group.add(coupling);
        const threadedBody = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.11, 32), flMat);
        threadedBody.position.y = 0.145;
        group.add(threadedBody);
        for (let y = 0.105; y <= 0.19; y += 0.012) {
          const thread = new THREE.Mesh(new THREE.TorusGeometry(0.077, 0.003, 5, 32), nutMat);
          thread.rotation.x = Math.PI / 2;
          thread.position.y = y;
          group.add(thread);
        }
        const hexHead = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.075, 6), plugMat);
        hexHead.position.y = 0.235;
        group.add(hexHead);
        const baseWeld = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.009, 8, 48), weldMat);
        baseWeld.rotation.x = Math.PI / 2;
        baseWeld.position.y = 0.008;
        group.add(baseWeld);
        totalH = 0.28;
        plugNS = new THREE.Group();
        plugFS = new THREE.Group();
        group.add(plugNS, plugFS);
      } else {
        const pOuter = 0.12, pInner = 0.09, nTop = 0.14, fOuter = 0.22;
        const pHeight = 0.15, nHeight = 0.08, fThick = 0.03;
        const tubeProfile = [
          [pInner, 0], [pOuter, 0], [pOuter, pHeight],
          [nTop, pHeight + nHeight], [pInner, pHeight + nHeight], [pInner, 0]
        ].map(([x, y]) => new THREE.Vector2(x, y));
        group.add(new THREE.Mesh(new THREE.LatheGeometry(tubeProfile, 48), nzMat));
        const flangeShape = new THREE.Shape();
        flangeShape.absarc(0, 0, fOuter, 0, Math.PI * 2, false);
        const bore = new THREE.Path();
        bore.absarc(0, 0, pInner, 0, Math.PI * 2, true);
        flangeShape.holes.push(bore);
        for (let i = 0; i < 8; i++) {
          const angle = (i + 0.5) * Math.PI / 4;
          const boltHole = new THREE.Path();
          boltHole.absarc(Math.cos(angle) * 0.18, Math.sin(angle) * 0.18, 0.014, 0, Math.PI * 2, true);
          flangeShape.holes.push(boltHole);
        }
        const flange = new THREE.Mesh(new THREE.ExtrudeGeometry(flangeShape, {
          depth: fThick, bevelEnabled: true, bevelThickness: 0.0015,
          bevelSize: 0.0015, bevelSegments: 1, steps: 1, curveSegments: 32
        }), flMat);
        flange.rotation.x = -Math.PI / 2;
        flange.position.y = pHeight + nHeight;
        group.add(flange);
        totalH = pHeight + nHeight + fThick;
        const faceProfile = [[pInner, totalH], [0.145, totalH],
          [0.145, totalH + 0.008], [pInner, totalH + 0.008], [pInner, totalH]]
          .map(([x, y]) => new THREE.Vector2(x, y));
        const faceMesh = new THREE.Mesh(new THREE.LatheGeometry(faceProfile, 48), flMat);
        faceMesh.visible = group.userData.face === 'RF';
        group.add(faceMesh);
        group.userData.faceMesh = faceMesh;
        const hole = new THREE.Mesh(new THREE.CircleGeometry(pInner, 32), holeMat);
        hole.rotation.x = -Math.PI / 2;
        hole.position.y = 0.003;
        group.add(hole);
        const baseWeld = new THREE.Mesh(new THREE.TorusGeometry(pOuter, 0.008, 8, 48), weldMat);
        baseWeld.rotation.x = Math.PI / 2;
        baseWeld.position.y = 0.007;
        group.add(baseWeld);
        plugNS = createNozzlePlug(flMat);
        plugNS.rotation.x = Math.PI / 2;
        plugNS.position.set(0, pHeight / 2, pOuter);
        plugNS.visible = hasNS;
        group.add(plugNS);
        plugFS = createNozzlePlug(flMat);
        plugFS.rotation.x = -Math.PI / 2;
        plugFS.position.set(0, pHeight / 2, -pOuter);
        plugFS.visible = hasFS;
        group.add(plugFS);
      }
      group.userData.plugNS = plugNS;
      group.userData.plugFS = plugFS;

      const nozzleSprite = createTextSprite(tagText, 'white', 40);
      nozzleSprite.position.set(0, totalH + 0.2, 0);
      group.add(nozzleSprite);
      group.userData.nozzleSprite = nozzleSprite;

      const inches = DIAMETER_INCHES[dIndex] || 2;
      const scaleFactor = type === 'threaded'
        ? 0.48 + Math.sqrt(inches) * 0.14
        : 0.28 + Math.sqrt(inches) * 0.23;
      group.scale.set(scaleFactor, scaleFactor, scaleFactor);

      placeNozzle(group, posX, pos, bodyPart);

      heatExchanger.add(group);
      return group;
    }

    function loadExchangerData(data) {
      loadDimensions(data.dimensions, data.model);
      applyModel(data.model);
      currentNameplate = data.nameplate || "";
      document.getElementById("nameplate-input").value = currentNameplate;
      updateNameplateText(currentNameplate);
      
      nozzlesList.forEach(nz => heatExchanger.remove(nz));
      nozzlesList = [];
      customNozzleCount = 0;

      const sourceNozzles = Array.isArray(data.nozzles) ? data.nozzles.map(n => ({...n})) : [];
      // Los diseños anteriores guardaban venteo y drenaje fuera de la lista.
      for (const [service, legacySize, pos, defaultTag] of [
        ['vent', data.vent, 'superior', 'VENT'], ['drain', data.drain, 'inferior', 'DRAIN']
      ]) {
        if (legacySize && !sourceNozzles.some(n => n.service === service)) {
          const diaIndex = DIAMETERS.indexOf(legacySize);
          sourceNozzles.push({
            tagName: defaultTag, service, diaIndex: diaIndex >= 0 ? diaIndex : 1,
            connectionType: 'threaded', rating: '3000#', bodyPart: 'bonnet', pos,
            valX: BODY_BOUNDS.bonnet.center, hasNS: false, sizeNS: '', tagNS: '',
            hasFS: false, sizeFS: '', tagFS: '', face: 'RF'
          });
        }
      }

      if(sourceNozzles.length) {
        sourceNozzles.forEach(n => {
          customNozzleCount++;
          const internalName = `Nozzle_${customNozzleCount}`;
          // Compatibilidad: en diseños antiguos tagNS/tagFS guardaban la medida.
          const legacyNS = n.sizeNS === undefined;
          const legacyFS = n.sizeFS === undefined;
          const newNz = buildNozzle(
            internalName, n.tagName, n.diaIndex, n.connectionType || 'flanged',
            n.rating, n.bodyPart, n.pos, n.valX,
            n.hasNS, legacyNS ? (n.tagNS || "") : (n.sizeNS || ""), legacyNS ? "" : (n.tagNS || ""),
            n.hasFS, legacyFS ? (n.tagFS || "") : (n.sizeFS || ""), legacyFS ? "" : (n.tagFS || ""),
            n.service || 'process', n.face || 'RF'
          );
          nozzlesList.push(newNz);
        });
      }
      deselectNozzle();
      syncStateToParent();
    }

    window.addEventListener('pointerdown', (event) => {
      if (readOnly || saving) return;
      if (event.target.closest('#ui-container, #toggle-equipment-panel')) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(heatExchanger.children, true);
      let clickedNozzle = null;

      for (let i = 0; i < intersects.length; i++) {
        let obj = intersects[i].object;
        while (obj && obj !== heatExchanger) {
          if (obj.userData && obj.userData.isNozzle) {
            clickedNozzle = obj;
            break;
          }
          obj = obj.parent;
        }
        if (clickedNozzle) break;
      }

      if (clickedNozzle) selectNozzle(clickedNozzle);
      else deselectNozzle();
    });

    function updateNameplateText(text) {
      ctx.clearRect(0, 0, nameCanvas.width, nameCanvas.height);
      if(!text || text.trim() === "") {
        plateTexture.needsUpdate = true;
        return; 
      }

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, nameCanvas.width, nameCanvas.height);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 24;
      ctx.strokeRect(0, 0, nameCanvas.width, nameCanvas.height);
      
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(45, 45, 15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(nameCanvas.width-45, 45, 15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(45, nameCanvas.height-45, 15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(nameCanvas.width-45, nameCanvas.height-45, 15, 0, Math.PI*2); ctx.fill();

      ctx.font = 'bold 120px sans-serif'; 
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeText(text, nameCanvas.width / 2, nameCanvas.height / 2);
      ctx.fillStyle = '#000000';
      ctx.fillText(text, nameCanvas.width / 2, nameCanvas.height / 2);
      
      plateTexture.needsUpdate = true;
    }

        editFsSize.disabled = !editFsCheck.checked;
        editFsTag.disabled = !editFsCheck.checked;
        document.getElementById('save-status').textContent = args.ack.message;
      }
      send('streamlit:setFrameHeight', {height: args.height || 720});
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    } catch (error) {
      window.exchangerBridge.fail(error);
    }
  </script>
</body>
</html>
